services:

  # =====================================================
  # PostgreSQL Database
  # =====================================================
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ZabbixNMS@2025Secure
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Zabbix Server (CUSTOM BUILD from src/)
  # Uncomment below to build from source
  # Comment it out and use official image for faster startup
  # =====================================================
  zabbix-server:
    # --- Option A: Official image (fast, no backend changes) ---
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    # --- Option B: Custom build from source (when you modify src/) ---
    # build:
    #   context: .
    #   dockerfile: Dockerfile.server
    # image: advantal-nms-server:7.0
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ZabbixNMS@2025Secure
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    networks:
      - zabbix-net

  # =====================================================
  # Zabbix Web Frontend (CUSTOM BUILD from ui/)
  # =====================================================
  zabbix-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: advantal-nms-web:7.0
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ZabbixNMS@2025Secure
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: ADVANTAL TECHNOLOGIES PVT LTD
      PHP_TZ: Asia/Kolkata
    ports:
      - "9090:8080"
    networks:
      - zabbix-net

  # =====================================================
  # Zabbix Agent 2
  # =====================================================
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - zabbix-net

  # =====================================================
  # SNMP Traps Receiver
  # =====================================================
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:ubuntu-7.0-latest
    container_name: zabbix-snmptraps
    restart: unless-stopped
    ports:
      - "162:1162/udp"
    networks:
      - zabbix-net

volumes:
  zabbix-db-data:

networks:
  zabbix-net:
    driver: bridge
