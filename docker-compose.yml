services:

  # =====================================================
  # PostgreSQL Database
  # =====================================================
  advantal-db:
    image: postgres:16-alpine
    container_name: advantal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ZabbixNMS@2025Secure
      POSTGRES_DB: zabbix
    volumes:
      - advantal-db-data:/var/lib/postgresql/data
    networks:
      - advantal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Advantal Server (CUSTOM BUILD from src/)
  # =====================================================
  advantal-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: advantal-nms-server:7.0
    container_name: advantal-server
    restart: unless-stopped
    depends_on:
      advantal-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: advantal-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ZabbixNMS@2025Secure
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    networks:
      - advantal-net

  # =====================================================
  # Advantal Web Frontend (CUSTOM BUILD from ui/)
  # =====================================================
  advantal-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: advantal-nms-web:7.0
    container_name: advantal-web
    restart: unless-stopped
    depends_on:
      - advantal-server
      - advantal-db
    environment:
      DB_SERVER_HOST: advantal-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ZabbixNMS@2025Secure
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: advantal-server
      ZBX_SERVER_NAME: ADVANTAL TECHNOLOGIES PVT LTD
      PHP_TZ: Asia/Kolkata
    ports:
      - "9090:8080"
    networks:
      - advantal-net

  # =====================================================
  # Advantal Agent 2
  # =====================================================
  advantal-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: advantal-agent
    restart: unless-stopped
    depends_on:
      - advantal-server
    environment:
      ZBX_HOSTNAME: "Advantal server"
      ZBX_SERVER_HOST: advantal-server
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - advantal-net

  # =====================================================
  # SNMP Traps Receiver
  # =====================================================
  advantal-snmptraps:
    image: zabbix/zabbix-snmptraps:ubuntu-7.0-latest
    container_name: advantal-snmptraps
    restart: unless-stopped
    ports:
      - "162:1162/udp"
    networks:
      - advantal-net

volumes:
  advantal-db-data:
    name: advantal_nms-db-data

networks:
  advantal-net:
    driver: bridge
